<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Grundriss – Doppelhaus mit Treppenhaus</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #bfe0f2; font-family: 'Segoe UI', Arial, sans-serif; }
  #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  #ui {
    position: absolute; top: 14px; left: 14px; z-index: 10;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(4px);
    border-radius: 10px; padding: 12px 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    max-width: 300px;
  }
  #ui h1 { font-size: 15px; margin: 0 0 8px 0; color: #23323f; }
  #ui p { font-size: 11.5px; color: #566472; margin: 0 0 10px 0; line-height: 1.4; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  #ui button {
    background: #2f6f8f; color: #fff; border: none; border-radius: 6px;
    padding: 7px 10px; font-size: 11.5px; cursor: pointer; flex: 1 1 auto;
    transition: background .15s;
  }
  #ui button:hover { background: #245570; }
  #ui button.active { background: #1b3b4f; }
  #legend { position: absolute; bottom: 14px; left: 14px; z-index: 10;
    background: rgba(255,255,255,0.88); border-radius: 10px; padding: 10px 14px;
    font-size: 11px; color: #33404a; box-shadow: 0 4px 18px rgba(0,0,0,0.2); max-width: 230px; }
  #legend div { display:flex; align-items:center; margin: 3px 0; }
  #legend span.sw { width: 12px; height: 12px; border-radius: 3px; margin-right: 7px; display:inline-block; border: 1px solid rgba(0,0,0,0.15); }
  #hint { position: absolute; bottom: 14px; right: 14px; z-index: 10; color: #33404a;
    background: rgba(255,255,255,0.85); padding: 8px 12px; border-radius: 8px; font-size: 11px; max-width: 220px; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#bfe0f2; z-index: 20; font-size:15px; color:#23323f; }
</style>
</head>
<body>
<div id="loading">Lade 3D-Grundriss…</div>
<div id="container"></div>
<div id="ui">
  <h1>3D Grundriss – Wohngebäude</h1>
  <p>Spiegelsymmetrisches Doppelhaus (2 Wohnungen) mit zentralem Treppenhaus, nach der Vorlage nachgebaut.</p>
  <div class="row">
    <button id="btnRoof">Dach ein/aus</button>
    <button id="btnCeil">Wände transparent</button>
  </div>
  <div class="row">
    <button id="btnTop">Draufsicht</button>
    <button id="btnPersp">3D-Ansicht</button>
  </div>
  <div class="row">
    <button id="btnLabels">Raumnamen ein/aus</button>
    <button id="btnReset">Ansicht zurücksetzen</button>
  </div>
</div>
<div id="legend">
  <strong style="font-size:12px;">Raumtypen</strong>
  <div><span class="sw" style="background:#d9b98a"></span>Wohnzimmer</div>
  <div><span class="sw" style="background:#e0c9a6"></span>Schlafzimmer</div>
  <div><span class="sw" style="background:#cfcfcf"></span>Küche</div>
  <div><span class="sw" style="background:#bfe0e3"></span>Bad / WC</div>
  <div><span class="sw" style="background:#d8d3c8"></span>Flur</div>
  <div><span class="sw" style="background:#c9c2b3"></span>Treppenhaus</div>
</div>
<div id="hint">Maus: Drehen &middot; Rad: Zoom &middot; Rechte Taste: Verschieben</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";

/* ===========================================================
   GRUNDMASSE (aus der Vorlage, in Metern)
   Gebäude 27,80 x 18,32 m, spiegelsymmetrisch um die Mittelachse,
   zentraler Erschliessungskern mit Treppe.
   =========================================================== */
var BW = 27.8, BD = 18.32, WALL_H = 2.8;
var EXT_T = 0.30, INT_T = 0.14;
var CORE_X0 = 12.0, CORE_X1 = 15.8;

/* ---------- three.js Grundgerüst ---------- */
var scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe0f2);
scene.fog = new THREE.Fog(0xbfe0f2, 45, 110);

var camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 500);
var centerX = BW/2, centerZ = BD/2;
camera.position.set(centerX - 22, 22, centerZ + 26);

var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('container').appendChild(renderer.domElement);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(centerX, 1, centerZ);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI*0.495;
controls.minDistance = 4;
controls.maxDistance = 90;
controls.update();

/* ---------- Licht ---------- */
var hemi = new THREE.HemisphereLight(0xffffff, 0x6b8f5a, 0.65);
scene.add(hemi);

var sun = new THREE.DirectionalLight(0xfff3df, 1.05);
sun.position.set(centerX + 30, 45, centerZ - 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 35; sun.shadow.camera.bottom = -35;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 130;
sun.shadow.bias = -0.0015;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.28));

/* ---------- Boden / Grundstück ---------- */
var ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400,400),
  new THREE.MeshStandardMaterial({color:0x6fae5c, roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.06;
ground.receiveShadow = true;
scene.add(ground);

var slab = new THREE.Mesh(
  new THREE.BoxGeometry(BW+1.2, 0.22, BD+1.2),
  new THREE.MeshStandardMaterial({color:0xa8a29a, roughness:0.95})
);
slab.position.set(centerX, -0.11, centerZ);
slab.receiveShadow = true;
scene.add(slab);

/* Terrasse/Weg vor dem Haupteingang */
var path = new THREE.Mesh(
  new THREE.BoxGeometry(3.4, 0.05, 4.5),
  new THREE.MeshStandardMaterial({color:0xc9c2b3, roughness:0.9})
);
path.position.set((CORE_X0+CORE_X1)/2, 0.03, BD + 2.2);
path.receiveShadow = true;
scene.add(path);

/* ===========================================================
   MATERIALIEN
   =========================================================== */
var wallMat   = new THREE.MeshStandardMaterial({color:0xf2ede3, roughness:0.92});
var wallMatEx = new THREE.MeshStandardMaterial({color:0xe7dfce, roughness:0.85});
var doorMat   = new THREE.MeshStandardMaterial({color:0x8a5a3b, roughness:0.7});
var glassMat  = new THREE.MeshPhysicalMaterial({color:0xbfe3f2, transparent:true, opacity:0.35, roughness:0.05, metalness:0.1});
var frameMat  = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.6});
var roofMat   = new THREE.MeshStandardMaterial({color:0x8a3b2b, roughness:0.85});

var floorMats = {
  living:   new THREE.MeshStandardMaterial({color:0xd9b98a, roughness:0.8}),
  bedroom:  new THREE.MeshStandardMaterial({color:0xe0c9a6, roughness:0.8}),
  kitchen:  new THREE.MeshStandardMaterial({color:0xcfcfcf, roughness:0.6}),
  bath:     new THREE.MeshStandardMaterial({color:0xbfe0e3, roughness:0.5}),
  hall:     new THREE.MeshStandardMaterial({color:0xd8d3c8, roughness:0.7}),
  core:     new THREE.MeshStandardMaterial({color:0xc9c2b3, roughness:0.7}),
  study:    new THREE.MeshStandardMaterial({color:0xdccdb0, roughness:0.8})
};

var wallGroup = new THREE.Group(); scene.add(wallGroup);
var furnGroup = new THREE.Group(); scene.add(furnGroup);
var floorGroup = new THREE.Group(); scene.add(floorGroup);
var labelGroup = new THREE.Group(); scene.add(labelGroup);
var roofGroup = new THREE.Group(); scene.add(roofGroup);

/* ===========================================================
   HILFSFUNKTIONEN – WÄNDE
   =========================================================== */
function box(w,h,d,mat){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/**
 * orientation 'H' = Wand verläuft entlang X (fest bei Z=fixed)
 * orientation 'V' = Wand verläuft entlang Z (fest bei X=fixed)
 * openings: [{from,to,type:'door'|'window', sill, lintel, side}]
 */
function buildWall(orientation, fixed, start, end, thickness, height, openings, mat){
  mat = mat || wallMat;
  openings = (openings||[]).slice().sort(function(a,b){return a.from-b.from;});
  var cursor = start, solids = [];
  openings.forEach(function(o){
    if(o.from > cursor) solids.push([cursor,o.from]);
    cursor = Math.max(cursor, o.to);
  });
  if(end > cursor) solids.push([cursor,end]);

  solids.forEach(function(seg){
    var a=seg[0], b=seg[1], len=b-a;
    if(len<=0.01) return;
    var mesh = box(orientation==='H'?len:thickness, height, orientation==='H'?thickness:len, mat);
    var mid=(a+b)/2;
    if(orientation==='H') mesh.position.set(mid, height/2, fixed);
    else mesh.position.set(fixed, height/2, mid);
    wallGroup.add(mesh);
  });

  openings.forEach(function(o){
    var len = o.to-o.from, mid=(o.from+o.to)/2;
    if(o.type==='window'){
      var sill = o.sill!=null?o.sill:0.95;
      var lintel = o.lintel!=null?o.lintel:2.3;
      if(sill>0.01){
        var sb = box(orientation==='H'?len:thickness, sill, orientation==='H'?thickness:len, mat);
        if(orientation==='H') sb.position.set(mid, sill/2, fixed); else sb.position.set(fixed, sill/2, mid);
        wallGroup.add(sb);
      }
      if(height-lintel>0.01){
        var lb = box(orientation==='H'?len:thickness, height-lintel, orientation==='H'?thickness:len, mat);
        if(orientation==='H') lb.position.set(mid, lintel+(height-lintel)/2, fixed); else lb.position.set(fixed, lintel+(height-lintel)/2, mid);
        wallGroup.add(lb);
      }
      var gh = lintel-sill;
      var glass = box(orientation==='H'?len*0.9:thickness*0.4, gh*0.88, orientation==='H'?thickness*0.4:len*0.9, glassMat);
      if(orientation==='H') glass.position.set(mid, sill+gh/2, fixed); else glass.position.set(fixed, sill+gh/2, mid);
      wallGroup.add(glass);
      // Rahmen
      var frameOuter = box(orientation==='H'?len:thickness*0.9, gh, orientation==='H'?thickness*0.9:len, frameMat);
      var frameInner = box(orientation==='H'?len-0.1:thickness, gh-0.1, orientation==='H'?thickness:len-0.1, mat);
      if(orientation==='H'){ frameOuter.position.set(mid,sill+gh/2,fixed); frameInner.position.set(mid,sill+gh/2,fixed);}
      else { frameOuter.position.set(fixed,sill+gh/2,mid); frameInner.position.set(fixed,sill+gh/2,mid);}
      wallGroup.add(frameOuter);
    } else if(o.type==='door'){
      var leafLen = Math.max(len-0.08, 0.5);
      var side = o.side || 1;
      if(orientation==='H'){
        var leaf = box(0.045, 2.05, leafLen, doorMat);
        leaf.position.set(o.from+0.03, 1.025, fixed + side*(EXT_T*0+ leafLen/2 + thickness/2));
        wallGroup.add(leaf);
      } else {
        var leaf2 = box(leafLen, 2.05, 0.045, doorMat);
        leaf2.position.set(fixed + side*(leafLen/2 + thickness/2), 1.025, o.from+0.03);
        wallGroup.add(leaf2);
      }
    }
  });
}

function addFloor(rect, type){
  var w = rect.x1-rect.x0, d = rect.z1-rect.z0;
  var f = new THREE.Mesh(new THREE.BoxGeometry(w,0.06,d), floorMats[type]);
  f.position.set((rect.x0+rect.x1)/2, 0.03, (rect.z0+rect.z1)/2);
  f.receiveShadow = true;
  floorGroup.add(f);
}

function makeLabel(text, x, z, y){
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  canvas.width = 512; canvas.height = 128;
  ctx.font = 'bold 46px Segoe UI, Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle = 'rgba(20,30,40,0.0)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  var tw = ctx.measureText(text).width;
  roundRect(ctx, canvas.width/2-tw/2-24, canvas.height/2-34, tw+48, 68, 18);
  ctx.fillStyle = '#1f2c37';
  ctx.fillText(text, canvas.width/2, canvas.height/2+2);
  var tex = new THREE.CanvasTexture(canvas);
  var mat = new THREE.SpriteMaterial({map:tex, depthWrite:false, transparent:true});
  var spr = new THREE.Sprite(mat);
  spr.scale.set(2.6, 0.65, 1);
  spr.position.set(x, y||2.55, z);
  labelGroup.add(spr);
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath(); ctx.fill();
}

/* ===========================================================
   MÖBEL – GENERISCHE BAUSTEINE
   =========================================================== */
function group(x,z,rotY){
  var g = new THREE.Group();
  g.position.set(x,0,z);
  g.rotation.y = rotY||0;
  furnGroup.add(g);
  return g;
}

function addSofa(x,z,rotY,w){
  w = w||2.1;
  var g = group(x,z,rotY);
  var seat = box(w,0.4,0.85, new THREE.MeshStandardMaterial({color:0x4d6f92}));
  seat.position.set(0,0.2,0); g.add(seat);
  var back = box(w,0.55,0.18, new THREE.MeshStandardMaterial({color:0x415e7c}));
  back.position.set(0,0.55,-0.335); g.add(back);
  [-1,1].forEach(function(s){
    var arm = box(0.18,0.5,0.85, new THREE.MeshStandardMaterial({color:0x415e7c}));
    arm.position.set(s*(w/2-0.09),0.45,0); g.add(arm);
  });
  return g;
}
function addArmchair(x,z,rotY){
  var g = group(x,z,rotY);
  var seat = box(0.75,0.4,0.75,new THREE.MeshStandardMaterial({color:0x8f6b4d}));
  seat.position.set(0,0.2,0); g.add(seat);
  var back = box(0.75,0.55,0.15,new THREE.MeshStandardMaterial({color:0x7a5b41}));
  back.position.set(0,0.55,-0.3); g.add(back);
  return g;
}
function addCoffeeTable(x,z,rotY,w,d){
  w=w||1.0; d=d||0.55;
  var g = group(x,z,rotY);
  var top = box(w,0.05,d, new THREE.MeshStandardMaterial({color:0x6b4a30}));
  top.position.set(0,0.38,0); g.add(top);
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(p){
    var leg = box(0.05,0.36,0.05, new THREE.MeshStandardMaterial({color:0x2c2c2c}));
    leg.position.set(p[0]*(w/2-0.06),0.18,p[1]*(d/2-0.06)); g.add(leg);
  });
  return g;
}
function addTVUnit(x,z,rotY,w){
  w=w||1.4;
  var g = group(x,z,rotY);
  var cab = box(w,0.4,0.35, new THREE.MeshStandardMaterial({color:0x33302c}));
  cab.position.set(0,0.2,0); g.add(cab);
  var tv = box(w*0.85,0.6,0.05, new THREE.MeshStandardMaterial({color:0x111111}));
  tv.position.set(0,0.75+0.3,0.02); g.add(tv);
  return g;
}
function addRug(x,z,rotY,w,d,color){
  var g = group(x,z,rotY);
  var r = new THREE.Mesh(new THREE.CircleGeometry(w/2,24), new THREE.MeshStandardMaterial({color:color||0xb9482f, roughness:1}));
  r.rotation.x=-Math.PI/2; r.position.y=0.031; r.scale.set(1, d/w, 1); g.add(r);
  return g;
}

function addDiningTable(x,z,rotY,round,seats,size){
  var g = group(x,z,rotY);
  size = size || (round?1.2:1.5);
  var topMat = new THREE.MeshStandardMaterial({color:0x8a6642});
  if(round){
    var top = new THREE.Mesh(new THREE.CylinderGeometry(size/2,size/2,0.05,24), topMat);
    top.position.y=0.75; g.add(top);
    var leg = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,0.72,12), new THREE.MeshStandardMaterial({color:0x2c2c2c}));
    leg.position.y=0.36; g.add(leg);
    seats = seats||4;
    for(var i=0;i<seats;i++){
      var a = i/seats*Math.PI*2;
      addChair(size/2+0.42, 0, a+Math.PI, g);
    }
  } else {
    var w=size, d=size*0.65;
    var top2 = box(w,0.05,d, topMat); top2.position.y=0.75; g.add(top2);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(p){
      var leg2 = box(0.07,0.72,0.07, new THREE.MeshStandardMaterial({color:0x2c2c2c}));
      leg2.position.set(p[0]*(w/2-0.1),0.36,p[1]*(d/2-0.1)); g.add(leg2);
    });
    seats = seats||6;
    var per = seats/2;
    for(var s=-1;s<=1;s+=2){
      for(var k=0;k<per;k++){
        var cx = -w/2 + (w/(per+1))*(k+1);
        addChair(0, 0, 0, g, cx, s*(d/2+0.35), s>0?Math.PI:0);
      }
    }
  }
  return g;
}
function addChair(radius, ang, faceAng, parent, fixX, fixZ, fixRot){
  var cx = fixX!==undefined?fixX:Math.cos(ang)*radius;
  var cz = fixZ!==undefined?fixZ:Math.sin(ang)*radius;
  var rot = fixRot!==undefined?fixRot:faceAng;
  var chair = new THREE.Group();
  chair.position.set(cx,0,cz);
  chair.rotation.y = rot;
  var seat = box(0.42,0.06,0.42, new THREE.MeshStandardMaterial({color:0x6b4a30}));
  seat.position.y=0.46; chair.add(seat);
  var back = box(0.42,0.42,0.06, new THREE.MeshStandardMaterial({color:0x6b4a30}));
  back.position.set(0,0.67,-0.19); chair.add(back);
  [[-0.17,-0.17],[0.17,-0.17],[-0.17,0.17],[0.17,0.17]].forEach(function(p){
    var leg = box(0.04,0.46,0.04, new THREE.MeshStandardMaterial({color:0x2c2c2c}));
    leg.position.set(p[0],0.23,p[1]); chair.add(leg);
  });
  parent.add(chair);
}

function addBed(x,z,rotY,double){
  var w = double? 1.6:1.0, l=2.0;
  var g = group(x,z,rotY);
  var frame = box(w+0.1,0.28,l+0.1, new THREE.MeshStandardMaterial({color:0x6b4a30}));
  frame.position.y=0.14; g.add(frame);
  var mattress = box(w,0.18,l, new THREE.MeshStandardMaterial({color:0xf2ece0}));
  mattress.position.y=0.37; g.add(mattress);
  var blanket = box(w,0.05,l*0.62, new THREE.MeshStandardMaterial({color:0xb14a4a}));
  blanket.position.set(0,0.47,l*0.16); g.add(blanket);
  var pillowCount = double?2:1;
  for(var i=0;i<pillowCount;i++){
    var pw = w/pillowCount-0.08;
    var pillow = box(pw,0.09,0.4, new THREE.MeshStandardMaterial({color:0xffffff}));
    pillow.position.set((-w/2+pw/2+0.04)+i*(pw+0.08), 0.5, -l/2+0.28);
    g.add(pillow);
  }
  var headboard = box(w+0.1,0.65,0.08, new THREE.MeshStandardMaterial({color:0x5c3d26}));
  headboard.position.set(0,0.5,-l/2-0.02); g.add(headboard);
  return g;
}
function addNightstand(x,z,rotY){
  var g = group(x,z,rotY);
  var t = box(0.42,0.45,0.4, new THREE.MeshStandardMaterial({color:0x7a5b41}));
  t.position.y=0.225; g.add(t);
  return g;
}
function addWardrobe(x,z,rotY,w,d){
  w=w||1.6; d=d||0.6;
  var g = group(x,z,rotY);
  var body = box(w,2.1,d, new THREE.MeshStandardMaterial({color:0x8a6642}));
  body.position.y=1.05; g.add(body);
  var lineMat = new THREE.LineBasicMaterial({color:0x4a3420});
  var edges = new THREE.EdgesGeometry(body.geometry);
  var line = new THREE.LineSegments(edges, lineMat);
  line.position.copy(body.position); g.add(line);
  // Mitteltrennung
  var seam = box(0.02,2.0,d+0.01, new THREE.MeshStandardMaterial({color:0x4a3420}));
  seam.position.set(0,1.05,0); g.add(seam);
  return g;
}

function addKitchen(rect, wallSide){
  // wallSide: 'west'|'north'|'east'|'south' - Wand, an der die Zeile steht
  var g = new THREE.Group();
  furnGroup.add(g);
  var counterMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.6});
  var topMat = new THREE.MeshStandardMaterial({color:0x2c2c2c, roughness:0.4});
  var pad = 0.15;
  var cx0=rect.x0+pad, cx1=rect.x1-pad, cz0=rect.z0+pad, cz1=rect.z1-pad;
  var len, cx, cz, rot;
  if(wallSide==='west'){
    len = cz1-cz0; cx = rect.x0+0.35; cz=(cz0+cz1)/2; rot=Math.PI/2;
  } else if(wallSide==='north'){
    len = cx1-cx0; cx=(cx0+cx1)/2; cz=rect.z0+0.35; rot=0;
  } else if(wallSide==='east'){
    len = cz1-cz0; cx=rect.x1-0.35; cz=(cz0+cz1)/2; rot=Math.PI/2;
  } else {
    len = cx1-cx0; cx=(cx0+cx1)/2; cz=rect.z1-0.35; rot=0;
  }

function addStaircase(cx, cz){
  var g = new THREE.Group();
  g.position.set(cx,0,cz);
  furnGroup.add(g);
  var stepMat = new THREE.MeshStandardMaterial({color:0xcfc6b3, roughness:0.8});
  var railMat = new THREE.MeshStandardMaterial({color:0x555555, metalness:0.5, roughness:0.4});
  var steps = 11, riser = WALL_H/2/steps, tread = 0.27, width=1.15;
  // erster Lauf: nach +Z aufsteigend
  for(var i=0;i<steps;i++){
    var s = box(width, riser, tread, stepMat);
    s.position.set(-0.85, riser/2 + i*riser, -1.6 + i*tread);
    g.add(s);
  }
  // Podest
  var landing = box(width, 0.05, 1.3, stepMat);
  landing.position.set(-0.85, steps*riser, -1.6+steps*tread+1.3/2-tread/2);
  g.add(landing);
  // zweiter Lauf: zurück nach -Z, hoeher
  for(var j=0;j<steps;j++){
    var s2 = box(width, riser, tread, stepMat);
    s2.position.set(0.85, steps*riser + riser/2 + j*riser, -1.6 + (steps-1-j)*tread);
    g.add(s2);
  }
  // Gelaender (vereinfachte Pfosten + Handlauf)
  [-0.85,0.85].forEach(function(sx,idx){
    for(var k=0;k<=steps;k++){
      var py = (idx===0? k*riser : steps*riser+k*riser) + 0.5;
      var pz = idx===0 ? -1.6+k*tread : -1.6+(steps-k)*tread;
      var post = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1.0,6), railMat);
      post.position.set(sx + (sx<0?width/2-0.05:-(width/2-0.05)), py, pz);
      g.add(post);
    }
  });
  return g;
}

var camAnim = null;
function animateCamera(pos, target){
  camAnim = {
    fromPos: camera.position.clone(), toPos: pos,
    fromTarget: controls.target.clone(), toTarget: target,
    t:0
  };
}

/* ===========================================================
   RESIZE + LOOP
   =========================================================== */
window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  if(camAnim){
    camAnim.t += 0.025;
    var t = Math.min(camAnim.t,1);
    var ease = t<0.5 ? 2*t*t : -1+(4-2*t)*t;
    camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, ease);
    controls.target.lerpVectors(camAnim.fromTarget, camAnim.toTarget, ease);
    if(t>=1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
